<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="50%" stop-color="#211a14"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c87e"/>
      <stop offset="50%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#a8894e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8d56"/>
      <stop offset="100%" stop-color="#3d6639"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Subtle dot texture pattern -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#c8a96e" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" ry="16" fill="none" stroke="#c8a96e" stroke-width="1.5" opacity="0.25"/>
  <rect x="32" y="32" width="1136" height="566" rx="12" ry="12" fill="none" stroke="#c8a96e" stroke-width="0.5" opacity="0.15"/>

  <!-- Corner ornaments -->
  <g opacity="0.3" stroke="#c8a96e" stroke-width="1.5" fill="none">
    <path d="M50,70 L50,50 L70,50"/>
    <path d="M1130,50 L1150,50 L1150,70"/>
    <path d="M1150,560 L1150,580 L1130,580"/>
    <path d="M70,580 L50,580 L50,560"/>
  </g>

  <!-- Mouse silhouette (centered above text) -->
  <g transform="translate(600, 195)" filter="url(#shadow)">
    <!-- Mouse body -->
    <ellipse cx="0" cy="20" rx="42" ry="32" fill="#c8a96e"/>
    <!-- Mouse head -->
    <ellipse cx="0" cy="-12" rx="30" ry="26" fill="#c8a96e"/>
    <!-- Left ear -->
    <ellipse cx="-22" cy="-38" rx="16" ry="18" fill="#c8a96e"/>
    <ellipse cx="-22" cy="-38" rx="10" ry="12" fill="#28221c"/>
    <!-- Right ear -->
    <ellipse cx="22" cy="-38" rx="16" ry="18" fill="#c8a96e"/>
    <ellipse cx="22" cy="-38" rx="10" ry="12" fill="#28221c"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-16" r="4" fill="#28221c"/>
    <circle cx="10" cy="-16" r="4" fill="#28221c"/>
    <circle cx="-8" cy="-17" r="1.5" fill="#fff"/>
    <circle cx="12" cy="-17" r="1.5" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-6" rx="4" ry="3" fill="#a8894e"/>
    <!-- Whiskers -->
    <g stroke="#28221c" stroke-width="1" opacity="0.5">
      <line x1="-30" y1="-10" x2="-14" y2="-8"/>
      <line x1="-28" y1="-4" x2="-14" y2="-4"/>
      <line x1="14" y1="-8" x2="30" y2="-10"/>
      <line x1="14" y1="-4" x2="28" y2="-4"/>
    </g>
    <!-- Tail -->
    <path d="M38,30 Q60,10 55,45 Q50,65 70,55" fill="none" stroke="#c8a96e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Shield with checkmark (to the right of mouse) -->
  <g transform="translate(750, 175)" filter="url(#shadow)">
    <path d="M0,-40 L30,-25 L30,10 Q30,40 0,52 Q-30,40 -30,10 L-30,-25 Z" fill="url(#shieldGrad)" stroke="#c8a96e" stroke-width="2"/>
    <!-- Checkmark -->
    <path d="M-12,8 L-4,18 L14,-6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small shield on the left for symmetry -->
  <g transform="translate(450, 175)" filter="url(#shadow)" opacity="0.7">
    <path d="M0,-28 L21,-17 L21,7 Q21,28 0,37 Q-21,28 -21,7 L-21,-17 Z" fill="url(#shieldGrad)" stroke="#c8a96e" stroke-width="1.5" opacity="0.6"/>
    <path d="M-8,5 L-3,12 L10,-4" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>

  <!-- Main title -->
  <text x="600" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="url(#gold)" filter="url(#glow)">Captcha Transformice</text>

  <!-- Subtitle -->
  <text x="600" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#fff" opacity="0.7">Prove you're not a robot - Transformice style!</text>

  <!-- Decorative line under subtitle -->
  <line x1="380" y1="410" x2="820" y2="410" stroke="#c8a96e" stroke-width="1" opacity="0.3"/>

  <!-- Bottom accent dots -->
  <g opacity="0.25" fill="#c8a96e">
    <circle cx="570" cy="440" r="3"/>
    <circle cx="600" cy="440" r="3"/>
    <circle cx="630" cy="440" r="3"/>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c8a96e" opacity="0.4">transformice captcha verification</text>
</svg>
