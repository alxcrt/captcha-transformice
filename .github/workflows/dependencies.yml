{
  "name": "Dependency checks",
  "on": {
    "push": {},
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "dependency-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "dependency-gate": {
      "name": "Dependency gate",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "env": {
        "NEXT_TELEMETRY_DISABLED": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24"
          }
        },
        {
          "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
          "with": {
            "bun-version": "1.4.3"
          }
        },
        {
          "run": "cd captcha-designs && npm ci && npm run build"
        },
        {
          "run": "cd Transformice/proxy && npm ci && npm run build"
        },
        {
          "name": "Compile the game server and proxy on the declared runtimes",
          "run": "docker build --pull -t dependency-game ./Transformice\ndocker build --pull -t dependency-proxy ./Transformice/proxy\ndocker build --pull -t dependency-frontend ./captcha-designs"
        },
        {
          "name": "Exercise MongoDB, game protocol and WebSocket bridge offline",
          "run": "set -eu\ntrap 'docker logs dependency-game 2>/dev/null || true; docker logs dependency-proxy 2>/dev/null || true; docker rm -f dependency-game dependency-proxy dependency-mongo dependency-frontend 2>/dev/null || true; docker network rm dependency-game-test 2>/dev/null || true' EXIT\ndocker network create --internal dependency-game-test\ndocker run -d --name dependency-mongo --network dependency-game-test --memory 512m -e MONGO_INITDB_ROOT_USERNAME=fixture -e MONGO_INITDB_ROOT_PASSWORD=isolated-fixture mongo:8.0\nfor attempt in $(seq 1 60); do docker exec dependency-mongo mongosh --host dependency-mongo --quiet --eval 'db.getSiblingDB(\"admin\").auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); db.adminCommand({ping:1})' && break; sleep 2; done\ndocker exec dependency-mongo mongosh --quiet --eval 'db.getSiblingDB(\"admin\").auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); db.getSiblingDB(\"transformice3\").createUser({user:\"appfixture\",pwd:\"isolated-app-fixture\",roles:[{role:\"readWrite\",db:\"transformice3\"}]})'\ndocker exec dependency-mongo mongosh --quiet --eval 'db.getSiblingDB(\"admin\").auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); db.getSiblingDB(\"transformice3\").counters.insertOne({_id:\"lastPlayerId\",value:NumberLong(10)})'\ndocker run -d --name dependency-game --network dependency-game-test --memory 1g -e MONGODB_URI=mongodb://appfixture:isolated-app-fixture@dependency-mongo:27017/transformice3?authSource=transformice3 dependency-game\ndocker run -d --name dependency-proxy --network dependency-game-test --memory 256m -e TCP_HOST=dependency-game -e PATH_WS=true -e BIND_HOST=0.0.0.0 dependency-proxy node dist/index.js --offline\nfor attempt in $(seq 1 60); do docker exec dependency-proxy node --input-type=module -e \"import net from 'node:net';await new Promise((resolve,reject)=>{const s=net.connect(11802,'dependency-game',()=>s.write('<policy-file-request/>\\0'));s.setTimeout(3000,()=>s.destroy(Error('timeout')));s.on('error',reject);s.on('data',data=>{s.destroy();data.toString().includes('<cross-domain-policy>')?resolve():reject(Error('invalid policy'))})})\" && break; sleep 2; done\ndocker exec dependency-proxy node --input-type=module -e \"import WebSocket from 'ws';await new Promise((resolve,reject)=>{const ws=new WebSocket('ws://127.0.0.1:8081/ws/11801');const timer=setTimeout(()=>{ws.terminate();reject(Error('timeout'))},10000);ws.on('error',reject);ws.on('open',()=>ws.send(Buffer.from('<policy-file-request/>\\0')));ws.on('message',data=>{clearTimeout(timer);ws.close();data.toString().includes('<cross-domain-policy>')?resolve():reject(Error('invalid bridge response'))})})\"\ndocker run -d --network none --name dependency-frontend --memory 128m dependency-frontend\ndocker exec dependency-frontend wget -qO- http://127.0.0.1:4000/ | grep -qi '<!doctype html'\n"
        }
      ]
    },
    "verified-release-receipt": {
      "name": "Verified release receipt",
      "needs": "dependency-gate",
      "if": "(github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "write"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "GH_REPO": "${{ github.repository }}",
        "COMMIT": "${{ github.sha }}"
      },
      "steps": [
        {
          "name": "Record the exact successful default-branch commit",
          "run": "set -eu\ncase \"$COMMIT\" in *[!a-f0-9]*|'') exit 1;; esac\n[ \"${#COMMIT}\" -eq 40 ]\nref=\"homelab-verified-$COMMIT\"\nexisting=$(gh api \"repos/$GH_REPO/git/matching-refs/tags/$ref\" --jq \".[] | select(.ref == \\\"refs/tags/$ref\\\") | .object.sha\")\nif [ \"$existing\" = \"$COMMIT\" ]; then exit 0; fi\n[ -z \"$existing\" ]\ngh api --method POST \"repos/$GH_REPO/git/refs\" -f \"ref=refs/tags/$ref\" -f \"sha=$COMMIT\"\n"
        }
      ]
    }
  }
}
