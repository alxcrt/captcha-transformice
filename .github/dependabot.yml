{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "npm",
      "directory": "/captcha-designs",
      "schedule": {
        "interval": "daily",
        "time": "04:00",
        "timezone": "Europe/Bucharest"
      },
      "cooldown": {
        "default-days": 3,
        "semver-major-days": 7
      },
      "open-pull-requests-limit": 5,
      "groups": {
        "routine": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      }
    },
