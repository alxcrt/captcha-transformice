services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: tfmadmin
      MONGO_INITDB_ROOT_PASSWORD: tfmpassword123
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  java-server:
    build:
      context: ./Transformice
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "11802:11802"
      - "12802:12802"
      - "13802:13802"
      - "14802:14802"

  proxy:
    build:
      context: ./Transformice/proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - java-server
    environment:
      TCP_HOST: java-server
      BIND_HOST: "0.0.0.0"
    ports:
      - "11801:11801"
      - "12801:12801"
      - "13801:13801"
      - "14801:14801"
      - "8081:8081"
      - "8082:8082"

  frontend:
    build:
      context: ./captcha-designs
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - proxy
    ports:
      - "4000:4000"

volumes:
  mongo-data:
