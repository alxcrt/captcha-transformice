services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  java-server:
    build:
      context: ./Transformice
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongodb:27017/transformice3?authSource=transformice3
    depends_on:
      - mongodb
    ports:
      - "11802:11802"
      - "12802:12802"
      - "13802:13802"
      - "14802:14802"

  proxy:
    build:
      context: ./Transformice/proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - java-server
    command: ["node", "dist/index.js", "--offline"]
    environment:
      TCP_HOST: java-server
      BIND_HOST: "0.0.0.0"
      PATH_WS: "true"
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./captcha-designs
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - proxy
    ports:
      - "4000:4000"

volumes:
  mongo-data:
